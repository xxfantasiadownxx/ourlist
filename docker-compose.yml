services:
  backend:
    build: ./backend
    container_name: ourlist-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_FILE=/data/ourlist.json
    volumes:
      - ./ourlist-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
    container_name: ourlist-frontend
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      - backend
