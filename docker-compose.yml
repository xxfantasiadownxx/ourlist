services:
  backend:
    image: ghcr.io/xxfantasiadownxx/ourlist-backend:latest
    container_name: ourlist-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_FILE=/data/ourlist.json
    volumes:
      - ./ourlist-data:/data

  frontend:
    image: ghcr.io/xxfantasiadownxx/ourlist-frontend:latest
    container_name: ourlist-frontend
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      - backend
